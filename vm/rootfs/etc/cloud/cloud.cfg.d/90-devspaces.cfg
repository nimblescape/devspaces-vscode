# Written by the image of the VM of Devspaces: Lima gives its settings on a
# NoCloud disk (the label cidata); WSL has none, so cloud-init does not run
# there. The network of Lima runs with systemd-networkd.
datasource_list: [ NoCloud ]
system_info:
  network:
    renderers: [ networkd ]
