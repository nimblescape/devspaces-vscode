# Written by the image of the VM of Devspaces: the symbolic links
# /boot/vmlinuz and /boot/initrd.img name the newest kernel, which the boot
# loader of the disk for Lima starts (/boot/grub/grub.cfg).
do_symlinks = yes
link_in_boot = yes
