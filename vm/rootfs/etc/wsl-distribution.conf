# Written by the image of the VM of Devspaces: the settings of WSL for the
# installation from the .wsl file. Devspaces installs it without a shortcut
# in the Start menu and without a profile of Windows Terminal.
[oobe]
defaultName=devspaces

[shortcut]
enabled=false

[windowsterminal]
enabled=false
