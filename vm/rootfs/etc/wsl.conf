# Written by the image of the VM of Devspaces: the settings of WSL for the
# distribution of Devspaces. systemd starts Docker; root is the user of
# `wsl -d devspaces`; WSL mounts no drive of Windows at the start and turns
# off the start of Windows programs, so that Docker and the devspaces do not
# see the files of the Windows user by default. These are no wall: root in
# the distribution can mount the drives again (docs/security.md). Lima reads
# no part of this file.
[boot]
systemd=true

[user]
default=root

[automount]
enabled=false

[interop]
enabled=false
appendWindowsPath=false
