# Written by the image of the VM of Devspaces: only Lima logs in over SSH, and
# WSL has no SSH server. The image has no host keys, so that no two VMs share
# them: the first start of each VM creates them.
[Unit]
ConditionVirtualization=!wsl

[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
