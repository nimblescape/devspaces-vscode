# Record the GIF of the README (docs/images/devspaces.gif) from a real VS Code
# with the packaged extension, on a manual start for a branch. The job "record"
# prepares the demo devspace on the Docker engine of the runner, which the
# extension reaches over SSH as the remote host "school-server"
# (test/vscode/attach/prepare.ts with DEVSPACE_TEST_ATTACH_PREPARE=gif),
# installs the VSIX files of the extension and of the test sign-in
# (scripts/install-attach-extensions.mjs), and records the six scenes with
# test/gif/record.mjs: the sign-in, the start of the devspace, the view Docker
# Hosts, the reports of a volume and of the devspace container, the report and
# the log of the Monitor, and the utilization page. The repository list comes
# from the fake GitHub API of test/gif/fakeGitHub.mjs, because the test account
# has no real GitHub access. The job uploads the GIF, the video of the take, a
# screenshot of each scene and the logs as the artifact "readme-gif"; it gets no
# write scope. The job "commit" then commits the GIF to the branch of the run,
# never to the default branch, and the screenshots and logs of the run to
# test/gif/last-run/. A pull request that changes the recorder records too.

name: README GIF

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/readme-gif.yml
      - test/gif/**
      - test/vscode/attach/prepare.ts

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # As in the job "vscode attach" of ci.yml: the newest stable release, pinned for every step.
      - name: Choose the VS Code version
        run: |
          VERSION=$(curl -fsS --retry 3 'https://update.code.visualstudio.com/api/releases/stable?released=true' | jq -er '.[0]')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]$ ]]; then
            echo "::warning::The newest stable VS Code $VERSION is not pinned: @vscode/test-electron takes a stable version only with a patch number of one digit."
            VERSION=
          fi
          echo "VS Code ${VERSION:-stable}"
          echo "VSCODE_TEST_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      - name: Install Xvfb, xdotool, ffmpeg and the font Inter
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb xdotool ffmpeg fonts-inter

      - name: Prepare the Docker engine, the demo devspace and the test VS Code
        env:
          DEVSPACE_TEST_ATTACH_PREPARE: gif
        run: npm run test:vscode:attach:prepare

      - name: Install the extension and the test sign-in provider from VSIX files
        run: node scripts/install-attach-extensions.mjs

      - name: Record the GIF
        run: node test/gif/record.mjs

      - name: Show the Docker objects and the logs
        if: ${{ always() }}
        run: |
          set +e
          docker ps -a
          docker volume ls
          docker images
          cat test/gif/output/github.log
          tail -n 100 test/gif/output/vscode.log

      - name: Keep the GIF, the take, the screenshots and the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-gif
          path: |
            test/gif/output/*.gif
            test/gif/output/*.png
            test/gif/output/*.log
            test/gif/output/take.mkv
            test/gif/output/take.mkv.marks.json
          if-no-files-found: warn

  commit:
    needs: record
    if: ${{ always() && needs.record.result != 'cancelled' && github.ref_name != github.event.repository.default_branch && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The push of the GIF to the branch of the run.
      contents: write
    steps:
      - name: Check out the branch of the run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: false

      - name: Take the files of the job "record"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readme-gif
          path: ${{ runner.temp }}/readme-gif

      - name: Commit the GIF and the files of the run to the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RESULT: ${{ needs.record.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          files="$RUNNER_TEMP/readme-gif"
          rm -rf test/gif/last-run
          mkdir -p test/gif/last-run docs/images
          cp "$files"/*.png "$files"/*.log "$files"/take.mkv.marks.json test/gif/last-run/ 2>/dev/null || true
          if [[ "$RESULT" == success && -f "$files/devspaces.gif" ]]; then
            cp "$files/devspaces.gif" docs/images/devspaces.gif
            message="Record the README GIF"
          else
            message="The README GIF failed: the screenshots and logs of the run"
          fi
          git add -A docs/images test/gif/last-run
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet --message "$message" --message "The workflow \"README GIF\": $RUN_URL"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
