# Keep the pin of Lima (src/core/vm/limaPin.json), which Devspaces downloads
# on macOS and Linux to manage its VM (docs/requirements.md R-VM-001), up to
# date: every day through the workflow "Daily checks" (daily-checks.yml), and
# on a manual start. The job "pin" first downloads the files of the current
# pin again and fails when Lima replaced one of them, because then the
# extension refuses that download. Then it looks for the newest release of
# lima-vm/lima on GitHub (no pre-release) and, when it is newer than the pin,
# computes the size and the SHA-256 of the archive of each platform with
# scripts/lima-pin.mjs, which checks them against the file SHA256SUMS of the
# release and checks that each archive has limactl and the guest agent of its
# architecture. Only this job downloads, and it gets no write scope. When the
# pin changed, the job "pull request" commits the new pin to the branch
# lima-<version>, opens a pull request for it, and starts the workflows "CI"
# and "VM image" on that branch, because GitHub runs the workflows of a pull
# request that a workflow opened only after an approval:
# scripts/drop-approval-runs.sh deletes those waiting runs, which would end as
# failed runs. The checks of the started runs appear on the pull request, also
# the job "lima test", which starts the VM of Devspaces with the new version. A
# branch lima-<version> that has a pull request already, open, closed or
# merged, gets nothing new.
# Opening the pull request needs the repository setting "Allow GitHub Actions
# to create and approve pull requests" (Settings > Actions > General);
# without it, the job fails after the push, and the next run tries again. A
# pull request that changes this workflow, the script or the pin runs the job
# "pin", which writes nothing there. The commit and the pull request name the
# workflow of the run, "Daily checks" or "Lima".

name: Lima

on:
  # The workflow "Daily checks", every day.
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/lima.yml
      - scripts/lima-pin.mjs
      - src/core/vm/limaPin.json

permissions:
  # Checkout needs repository reads; only the job "pull request" gets more.
  contents: read

concurrency:
  group: lima
  cancel-in-progress: false

jobs:
  pin:
    name: pin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      version: ${{ steps.update.outputs.version }}
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check the files of the current pin
        run: node scripts/lima-pin.mjs --check

      - name: Look for a newer version
        id: update
        env:
          # Read access to the API of GitHub, with more requests per hour than without a login.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/lima-pin.mjs
          version=$(node -p 'require("./src/core/vm/limaPin.json").version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The pin names the version \"$version\", not x.y.z." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- src/core/vm/limaPin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The pin has the newest Lima, $version." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "The pin changes to Lima $version:"
              echo
              echo '```diff'
              git diff -- src/core/vm/limaPin.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the new pin
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lima-pin
          path: src/core/vm/limaPin.json
          if-no-files-found: error

  pull-request:
    name: pull request
    needs: pin
    if: needs.pin.outputs.changed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The push of the branch lima-<version>.
      contents: write
      # The pull request of that branch.
      pull-requests: write
      # The start of the workflows "CI" and "VM image" on that branch, and the deletion of the waiting runs of the pull
      # request.
      actions: write
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the new pin of the job "pin"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lima-pin
          path: src/core/vm

      - name: Push the branch, open the pull request, and start CI on it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pin.outputs.version }}
          # "Daily checks" when that workflow called this one.
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="lima-$VERSION"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ -n "$(git ls-remote --heads "$remote" "refs/heads/$branch")" ]]; then
            if [[ "$(gh pr list --head "$branch" --state all --json number --jq length)" != "0" ]]; then
              echo "The branch $branch has a pull request already." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "The branch $branch exists without a pull request: it gets one now."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch --create "$branch"
            git add src/core/vm/limaPin.json
            git commit --quiet --message "Pin Lima $VERSION" --message "The workflow \"$WORKFLOW\" computed the sizes and SHA-256 hashes from its download of each archive and checked them against the file SHA256SUMS of the release: $RUN_URL"
            git push "$remote" "HEAD:refs/heads/$branch"
          fi
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The workflow "$WORKFLOW" found [Lima $VERSION](https://github.com/lima-vm/lima/releases/tag/v$VERSION), the newest release of lima-vm/lima. It downloaded the archive of each platform of the pin (macOS and Linux, aarch64 and x86_64), computed its size and SHA-256, checked them against the file \`SHA256SUMS\` of the release, checked that each archive has \`bin/limactl\` and the guest agent of its architecture, and wrote them into \`src/core/vm/limaPin.json\` ([run]($RUN_URL)). Devspaces refuses a download of Lima whose size or SHA-256 differs from the pin.

          Read the [release notes](https://github.com/lima-vm/lima/releases/tag/v$VERSION) for changes that need a change of Devspaces. The workflow started the workflows "CI" and "VM image" on this branch, because GitHub runs the workflows of a pull request that a workflow opened only after an approval (the workflow deletes those waiting runs); their checks appear on this pull request. The job "lima test" of "VM image" creates and starts the VM of Devspaces with this version, runs Docker Engine in it, and waits for its power-off by the idle check. Merge when all checks pass. The next release of Devspaces uses this version.
          EOF
          if ! gh pr create --base main --head "$branch" --title "Pin Lima $VERSION" --body-file "$RUNNER_TEMP/body.md"; then
            echo "The pull request of $branch could not be opened. Turn on \"Allow GitHub Actions to create and approve pull requests\" in Settings > Actions > General; the next run opens it." >&2
            exit 1
          fi
          gh workflow run ci.yml --ref "$branch"
          gh workflow run vm-image.yml --ref "$branch"
          echo "The pull request of Lima $VERSION is open, and CI and VM image run on $branch." >> "$GITHUB_STEP_SUMMARY"
          bash scripts/drop-approval-runs.sh "$branch"
