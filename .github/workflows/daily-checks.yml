# The daily checks of the pins of Devspaces, in one run every day and on a
# manual start. Each job calls the workflow of one pin, which checks the
# current pin and, when there is a newer version, opens a pull request for it,
# starts the workflow "CI" on its branch, and deletes the runs of the pull
# request that wait for an approval (scripts/drop-approval-runs.sh):
#   Docker CLI    docker-cli.yml    the Docker CLI of Devspaces
#                                   (src/core/docker/dockerCliPin.json)
#   Buildx image  buildx-image.yml  the build image of Devspaces
#                                   (src/core/docker/buildxPin.json)
#   VM image      vm-image.yml      the image of the VM of Devspaces
#                                   (src/core/vm/vmImagePin.json): it builds
#                                   and tests the image every day, and pushes
#                                   it to ghcr.io only when its packages or
#                                   its recipe changed
#   Lima          lima.yml          the Lima of Devspaces on macOS and Linux
#                                   (src/core/vm/limaPin.json)
#   Node.js       node-version.yml  the Node.js release of the builds, the
#                                   tests, CI and the release (.node-version),
#                                   within its major version
# A day without a new version opens nothing. The jobs run side by side, and a
# failed job does not stop the others. Each called workflow also runs alone,
# on a manual start and on a pull request that changes it, its script or its
# pin. Dependabot checks the npm packages and the pinned actions every day as
# well, at 04:17 and 04:29 UTC (.github/dependabot.yml), because Dependabot
# cannot run in a workflow. A change of this workflow runs it on its pull
# request, where the called workflows write nothing: GitHub starts a scheduled
# run only from the workflow on the default branch.

name: Daily checks

on:
  schedule:
    # Every day at 04:41 UTC.
    - cron: '41 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/daily-checks.yml

permissions:
  # Only the jobs below get more, for the jobs "pull request" of the called workflows.
  contents: read

jobs:
  docker-cli:
    name: Docker CLI
    uses: ./.github/workflows/docker-cli.yml
    permissions:
      # The push of the branch docker-cli-<version>.
      contents: write
      # The pull request of that branch.
      pull-requests: write
      # The start of the workflow "CI" on that branch, and the deletion of the waiting runs of the pull request.
      actions: write

  buildx-image:
    name: Buildx image
    uses: ./.github/workflows/buildx-image.yml
    permissions:
      # The push of the branch buildx-<version>.
      contents: write
      # The pull request of that branch.
      pull-requests: write
      # The start of the workflow "CI" on that branch, and the deletion of the waiting runs of the pull request.
      actions: write

  vm-image:
    name: VM image
    uses: ./.github/workflows/vm-image.yml
    permissions:
      # The push of the branch vm-image-<version>.
      contents: write
      # The pull request of that branch, and the close of the older ones.
      pull-requests: write
      # The start of the workflow "CI" on that branch, and the deletion of the waiting runs of the pull request.
      actions: write
      # The push to ghcr.io/nimblescape/devspaces-vm and the deletion of old versions.
      packages: write

  lima:
    name: Lima
    uses: ./.github/workflows/lima.yml
    permissions:
      # The push of the branch lima-<version>.
      contents: write
      # The pull request of that branch.
      pull-requests: write
      # The start of the workflows "CI" and "VM image" on that branch, and the deletion of the waiting runs of the pull
      # request.
      actions: write

  node-version:
    name: Node.js
    uses: ./.github/workflows/node-version.yml
    permissions:
      # The push of the branch node-<version>.
      contents: write
      # The pull request of that branch.
      pull-requests: write
      # The start of the workflow "CI" on that branch, and the deletion of the waiting runs of the pull request.
      actions: write
